      data-i18n-attr="content:meta.support.description"

    <meta property="og:type" content="website" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "How do I switch between km/h and mph?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Open Settings in the app and toggle the units."
            }
          },
          {
            "@type": "Question",
            "name": "Where is my ride data stored?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "All ride history is stored locally on your device — nothing is uploaded anywhere."
            }
          },
          {
            "@type": "Question",
            "name": "I found a bug or have a feature request.",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Please open an issue on the GitHub repository — that's the fastest way to reach the developer."
            }
          },
          {
            "@type": "Question",
            "name": "Is BikeSpeed really free?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. No ads, no subscriptions, no in-app purchases — ever."
            }
          }
        ]
      }
    </script>
  </head>

    <div id="app"></div>
