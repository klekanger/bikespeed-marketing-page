  <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "How do I switch between km/h and mph?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Open Settings in the app and toggle the units."
            }
          },
          {
            "@type": "Question",
            "name": "Where is my ride data stored?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "On your phone. On iPhone, if you are signed into iCloud, it is also mirrored to your own private iCloud storage so it reaches your other iPhones. On Android it stays in the app on your phone, with no cloud sync. Either way, only you can read it; nothing is sent to the developer."
            }
          },
          {
            "@type": "Question",
            "name": "How do I get my rides onto another phone?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "On iPhone, sign both iPhones into the same Apple Account with iCloud turned on. Sync is automatic — there is nothing to switch on in BikeSpeed. Give it a minute after the first launch on the new device. The Android version has no sync, so rides stay on the phone they were recorded on."
            }
          },
          {
            "@type": "Question",
            "name": "How do I export a ride?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Open the ride in the trip log and tap Export GPX. The share sheet lets you send it to Strava, Komoot, or any other app that accepts GPX files."
            }
          },
          {
            "@type": "Question",
            "name": "Why does my trip pause by itself?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "That's auto-pause. It stops both distance and the clock while you're standing still, so waiting at a red light doesn't drag your average speed down. You can turn it off in Settings."
            }
          },
          {
            "@type": "Question",
            "name": "Does it keep recording if I lock the screen?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. A running trip keeps recording with the screen locked or the app in the background, so you can put the phone in your pocket mid-ride."
            }
          },
          {
            "@type": "Question",
            "name": "Why do climb and gradient show “--”?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Climb and gradient are most accurate from the barometer. On iPhone it needs Motion & Fitness access — allow it in iOS Settings ▸ BikeSpeed. Not every Android phone has a barometer. Without one the app falls back to GPS altitude, which needs a decent signal, so the readings can stay blank indoors or under heavy tree cover."
            }
          },
          {
            "@type": "Question",
            "name": "Which phone do I need?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "BikeSpeed 2.0 runs on an iPhone with iOS 18 or later, or an Android phone with Android 11 or later and Google Play services."
            }
          },
          {
            "@type": "Question",
            "name": "I found a bug or have a feature request.",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Please open an issue on the GitHub repository — that's the fastest way to reach the developer."
            }
          },
          {
            "@type": "Question",
            "name": "Is BikeSpeed really free?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. No ads, no subscriptions and no in-app purchases — everything in the app is free to use."
            }
          }
        ]
      }
